name: Publish Docker image to GHCR

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tridentchain-mcp
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  enforce-public-visibility:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ !cancelled() }}
    steps:
      - name: Ensure the container package stays public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Read current visibility. New packages are private by default; existing
          # ones inherit the last-set value. If it's ever not `public`, fail loud.
          VIS=$(gh api "/users/${{ github.repository_owner }}/packages/container/tridentchain-mcp" --jq '.visibility' 2>/dev/null || echo "unknown")
          echo "Current package visibility: $VIS"
          if [ "$VIS" != "public" ]; then
            echo "::error::Container package visibility is '$VIS'. Expected 'public'."
            echo "::error::Fix at: https://github.com/users/${{ github.repository_owner }}/packages/container/tridentchain-mcp/settings"
            exit 1
          fi
          echo "✅ ghcr.io/${{ github.repository_owner }}/tridentchain-mcp is public"
