name: Publish Packages

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-pypi:
    name: Build and publish both Python packages to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build tridentchain-security (root package)
        run: python -m build

      - name: Build tridentchain-mcp (subdirectory package)
        working-directory: tridentchain-mcp
        run: python -m build

      - name: Verify PYPI_TOKEN is set
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::PYPI_TOKEN secret not configured. Add it in Settings → Secrets → Actions."
            exit 1
          fi

      - name: Publish tridentchain-security to PyPI (skip-existing)
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload --skip-existing \
            dist/tridentchain_security-* \
            -u __token__ -p "$PYPI_TOKEN"

      - name: Publish tridentchain-mcp to PyPI (skip-existing)
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload --skip-existing \
            tridentchain-mcp/dist/tridentchain_mcp-* \
            -u __token__ -p "$PYPI_TOKEN"

  publish-npm:
    name: Publish npm wrapper (opt-in via PUBLISH_NPM=1 repo variable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate on the PUBLISH_NPM repository variable
        id: gate
        env:
          PUBLISH_NPM: ${{ vars.PUBLISH_NPM }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm publishing is opt-in — matches scripts/publish-packages.sh
          # which checks `PUBLISH_NPM=1`. Setting the token alone is not enough
          # (the token is scope-bound and may not have permission to create
          # `@tridentchain/*` if the org hasn't been set up). Explicit opt-in
          # avoids surprise 404s on releases.
          if [ "$PUBLISH_NPM" != "1" ]; then
            echo "::notice::PUBLISH_NPM repo variable is not '1' — skipping npm publish. This is the default; set the repo variable at Settings → Secrets and variables → Actions → Variables to opt in."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::PUBLISH_NPM=1 is set but NPM_TOKEN secret is missing. Add an npm automation or granular token with write access to the @tridentchain scope."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm wrapper
        if: steps.gate.outputs.skip == 'false'
        working-directory: npm-wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
